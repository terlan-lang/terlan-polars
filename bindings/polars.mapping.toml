[package]
terlan = "polars"
cargo = "terlan_polars_native"
upstream = "polars"
version = "0.55.2"
features = ["lazy", "streaming", "sql", "csv", "parquet", "json", "ipc", "cloud", "http", "aws", "gcp", "azure", "strings", "temporal", "range", "arg_where", "dtype-date", "dtype-datetime", "dtype-time", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-i128", "dtype-u128", "dtype-f16", "dtype-array", "dtype-extension", "dtype-decimal", "dtype-categorical", "timezones", "round_series", "is_between", "is_in", "is_close", "is_first_distinct", "is_last_distinct", "is_unique", "approx_unique", "dtype-struct", "unique_counts", "regex", "interpolate", "interpolate_by", "peaks", "rle", "ewma", "ewma_by", "concat_str", "rank", "top_k", "replace", "cutqcut", "trigonometry", "cum_agg", "rolling_window", "rolling_window_by", "moment", "mode", "index_of", "search_sorted", "repeat_by", "pct_change", "log", "product", "semi_anti_join", "cross_join", "asof_join", "iejoin", "diagonal_concat", "pivot", "dynamic_group_by"]
status = "feature-gated"
runtime = "beam-port-helper"

[types]
DataFrame = { rust = "TerlanPolarsDataFrame", terlan = "polars.DataFrame.DataFrame", opaque = true }
LazyFrame = { rust = "TerlanPolarsLazyFrame", terlan = "polars.DataFrame.LazyFrame", opaque = true }
Series = { rust = "TerlanPolarsSeries", terlan = "polars.DataFrame.Series", opaque = true }
SqlContext = { rust = "TerlanPolarsSqlContext", terlan = "polars.DataFrame.SqlContext", opaque = true }
TableStyle = { rust = "String", terlan = "polars.DataFrame.TableStyle", opaque = true, ownership = "value" }
Expr = { rust = "String", terlan = "polars.DataFrame.Expr", opaque = true, ownership = "value" }
ExprUdf = { rust = "String", terlan = "polars.DataFrame.ExprUdf", opaque = true, ownership = "value" }

